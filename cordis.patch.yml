# dsh-engine-switch bundle patch —— 在本 bundle 的层里只追加**一行**。
#
# `engine-switch`：插件本体。它在 apply 时接管 ctx.agents 的 factory slot，按
# engine 意图（forceEngine / 请求 marker / 会话绑定 / agentPreset 兼容命中 / 独立
# 选择器 config.engine）决定 create|resume 落到哪个引擎。
#
# ⚠️ 这里**故意不再声明任何 preset**。
#
# 上一轮曾在这个文件里加过一行 `preset-pi`（@deepseek-ai/dsh-agent-preset，
# config.id: pi），让「Pi 引擎」出现在桌面端新建任务页的 **Agent 预设下拉框**里。
# 那是错位的：Agent Preset 决定**会话内容面**（系统提示词模板 / 角色 / 工具插件集：
# 标准、极简、创造…），Engine 决定**底座谁在驱动**（DSH 原生 AgentLoop / OAR 驱动的
# pi / 回声）。把引擎降格成「预设的一种」，等于每多一个引擎就往「标准模式 / 创造模式」
# 那一列里塞一项 —— 两个正交维度被焊死在一起。
#
# 现在引擎走自己的四个入口（都与 preset 下拉框无关）：
#   ① 斜杠命令 `/engine [native|pi|echo]`（输入区域；host 侧注册，见 engine-command.mjs）
#   ② 本插件自己的配置字段 `engine`（volatile ⇒ 设置页可编辑、实时生效、写回 profile patch）
#   ③ 请求级 marker（`options.meta.engine` / `options.engine`，给 headless / ACP / 脚本按次钉死）
#   ④ **主会话框上的「⚡ 引擎」下拉 Chip**（客户端半边 client.js：新会话起始页
#      `conversation.hero.options` 与输入框上方 `conversation.input.dock` 各一枚，
#      点开是 `shell.overlay` 里的选择面板）——它写的就是 ② 的那个值，
#      走 DSH 通用的 `ctx.remote.settings.update`，不是第二套权威。
#
# 于是「创造模式 + Pi 引擎」「标准模式 + Pi 引擎」都是合法且独立的组合：preset 照旧在
# 新建任务页的预设 chip 里选（原生四种业务模式），engine 在上面任一入口选。
#
# 历史兼容（**没有** UI，但判据仍在）：改造前已建/已存量的会话可能在 session header
# 里记着 `agentPreset: pi`，插件会继续按 config.piPreset（缺省 'pi'）把这类会话交给
# pi 引擎 —— 会话自己的身份优先于全局缺省，见 engine-intent.mjs 的优先级表。
#
# `Config.engine` 是 volatile 字段，所以 settings 会把本 entry 的 id（`engine-switch`）
# 当作命名空间暴露出来；桌面端设置页 / `/engine` 命令 / 上面的「⚡ 引擎」Chip 改的都是同一个值（profile
# cordis.patch.yml 里的 `engine-switch: { engine: ... }`）。
#
# 浏览器半边（client.js）由本包的 `dsh.client` 声明 + `exports["./client"]` 交给
# dsh-client-modules 组装进 boot 图；它只 require 平台种子 react / react/jsx-runtime，
# 且**不**硬 inject `remote.settings`（可选依赖走 ctx.get 现取：拿不到就渲染「不可用」，
# 不让本条目 pending —— 客户端条目 pending 会把整页卡在 "Failed to load plugins"）。
- insert:
    - id: engine-switch
      name: '@local/dsh-engine-switch'
      config: {}
